<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0c"><title>SCF · Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0b0c;--panel:#151516;--line:#303033;--text:#f5f5f5;--muted:#a1a1a6;--green:#22c55e;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#252525 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.5 'DM Sans',system-ui,sans-serif}.wrap{width:min(1100px,100%);margin:auto;padding:clamp(18px,4vw,44px)}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:28px}.brand{font-weight:700;font-size:17px}.brand span{color:#bbb}.eyebrow{font:10px 'DM Mono';letter-spacing:1.5px;color:var(--muted)}h1{font-size:clamp(28px,5vw,42px);letter-spacing:-1.5px;margin:8px 0}p{color:var(--muted)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0}.login{max-width:430px;margin:50px auto}.field{display:block;margin:14px 0 5px;color:#ccc;font-size:12px}input{width:100%;padding:12px 14px;border:1px solid #3b3b3f;border-radius:10px;background:#0f0f10;color:#fff;font:inherit}button{font:inherit;cursor:pointer;border-radius:10px;padding:10px 14px;border:1px solid #444;background:#222224;color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}.primary{width:100%;margin-top:16px;background:#f2f2f2;color:#111;border-color:#f2f2f2}.smallbtn{font-size:12px;padding:7px 10px}.green{background:#123a25;border-color:#267a47;color:#9ff0b8}.red{background:#3b1719;border-color:#8c3035;color:#ffb3b7}.status{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;color:#ccc}.dot{width:8px;height:8px;border-radius:50%;background:#777}.dot.on{background:var(--green);box-shadow:0 0 10px #22c55e77}.dot.off{background:var(--red)}.request{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.request:last-child{border-bottom:0}.request h3{margin:0 0 5px;font-size:16px}.meta{color:var(--muted);font-size:12px}.controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.hidden{display:none!important}.notice{padding:12px;border:1px solid #5c4b27;border-radius:10px;background:#282116;color:#f3d89c;font-size:12px;white-space:pre-wrap}.error{color:#ffb3b7}.empty{padding:28px 8px;text-align:center;color:var(--muted)}@media(max-width:650px){.request{grid-template-columns:1fr}.controls{justify-content:flex-start}.panel{padding:16px}header{align-items:flex-start}}
</style>
</head>
<body><main class="wrap">
<header><div><div class="brand">Smart <span>Components</span> Finder</div><div class="eyebrow">WORKSHOP · ADMIN CONSOLE</div></div><button id="logout" class="hidden">Sign out</button></header>
<section id="loginPanel" class="panel login"><div class="eyebrow">SECURE ACCESS</div><h1>Admin sign in</h1><p>Sign in with an account enabled in Firebase Authentication.</p><form id="loginForm"><label class="field" for="email">Email</label><input id="email" type="email" autocomplete="username" required><label class="field" for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Sign in</button></form><p id="loginMessage" class="error" role="status"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="toolbar"><div><div class="eyebrow">LIVE DATABASE</div><h1>Requests</h1><p>Review requests and choose whether the ESP32 should show each part on its OLED.</p></div><span class="status"><span class="dot on"></span><span id="connection">Connecting…</span></span></div><div id="notice" class="notice hidden"></div><div id="requests"><div class="empty">Loading requests…</div></div></div></section>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAKN_XLImO7kC1IkcAXJi8S-23CvwporgQ",
  authDomain: "smart-components-finder.firebaseapp.com",
  projectId: "smart-components-finder",
  storageBucket: "smart-components-finder.firebasestorage.app",
  messagingSenderId: "32718644812",
  appId: "1:32718644812:web:51b479d1eb4dc0792136e9",
  measurementId: "G-JGMVGDPQKN"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const $ = s => document.querySelector(s);
let stopRequests = null;
const safe = value => String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showNotice(message){const el=$("#notice");el.textContent=message;el.classList.remove("hidden")}
function hideNotice(){$("#notice").classList.add("hidden")}
function renderRequests(data){
 const host=$("#requests");
 const entries=Object.entries(data||{}).map(([id,value])=>({id,...(value||{})}));
 if(!entries.length){host.innerHTML='<div class="empty">No requests yet. New customer requests will appear here.</div>';return}
 host.innerHTML=entries.map(r=>{
  const on=r.displayOnOLED===true;
  const status=String(r.status||"pending");
  return '<article class="request"><div><h3>'+safe(r.component||"Unnamed component")+'</h3><div class="meta">Request: '+safe(r.id)+' · Quantity: '+safe(r.quantity??1)+' · Container: '+safe(r.container??"Not assigned")+'</div><div class="meta">Status: '+safe(status)+'</div><div class="actions"><button class="smallbtn" data-status="accepted" data-id="'+safe(r.id)+'">Accept</button><button class="smallbtn" data-status="rejected" data-id="'+safe(r.id)+'">Reject</button><button class="smallbtn" data-status="completed" data-id="'+safe(r.id)+'">Complete</button></div></div><div class="controls"><span class="status"><span class="dot '+(on?"on":"off")+'"></span>OLED '+(on?"ON":"OFF")+'</span><button class="smallbtn '+(on?"red":"green")+'" data-display="'+(on?"off":"on")+'" data-id="'+safe(r.id)+'">'+(on?"Turn OFF":"Turn ON")+'</button></div></article>'
 }).join("");
}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();$("#loginMessage").textContent="Signing in…";try{await signInWithEmailAndPassword(auth,$("#email").value.trim(),$("#password").value)}catch(err){$("#loginMessage").textContent="Sign-in failed: "+err.message}});
$("#logout").addEventListener("click",()=>signOut(auth));
onAuthStateChanged(auth,user=>{
 if(stopRequests){stopRequests();stopRequests=null}
 $("#loginPanel").classList.toggle("hidden",!!user);$("#dashboard").classList.toggle("hidden",!user);$("#logout").classList.toggle("hidden",!user);
 if(!user)return;
 $("#connection").textContent="Listening for updates";
 stopRequests=onValue(ref(db,"requests"),snapshot=>{hideNotice();renderRequests(snapshot.val());$("#connection").textContent="Live"},error=>{showNotice("Database read failed. Check Realtime Database Rules and authenticated-user permissions.\n"+error.message);$("#connection").textContent="Access denied";$("#requests").innerHTML='<div class="empty">Cannot read requests until database rules permit this signed-in admin.</div>'});
});
$("#requests").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-id]");if(!b)return;
 const id=b.dataset.id;
 try{
  if(b.dataset.status)await update(ref(db,"requests/"+id),{status:b.dataset.status,updatedAt:new Date().toISOString()});
  else if(b.dataset.display)await update(ref(db,"requests/"+id),{displayOnOLED:b.dataset.display==="on",updatedAt:new Date().toISOString()});
 }catch(err){showNotice("Update failed. Your database rules may not allow this account to edit requests.\n"+err.message)}
});
</script></body></html>
